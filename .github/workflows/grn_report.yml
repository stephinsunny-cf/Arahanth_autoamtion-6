name: Item Wise GRN Report V2 Automation

on:
  schedule:
    # Runs at 00:30 UTC every day (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-grn-reports:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Run GRN Report Automation
      env:
        # The credentials should be added to GitHub Secrets as SUPPLYNOTE_CREDENTIALS
        SUPPLYNOTE_CREDENTIALS: ${{ secrets.SUPPLYNOTE_CREDENTIALS }}
      run: |
        python grn_report_automation.py
